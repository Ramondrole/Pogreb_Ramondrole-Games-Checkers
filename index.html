<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramondrole - Шашки</title>
    <link rel="icon" href="./Ramondrole.webp">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="checkers.css">
</head>
<body>
    <nav>
        <div class="logo">RAMONDROLE</div>
        <div class="nav-links">
            <a href="https://ramondrole.github.io/Pogreb_Ramondrole-About_me/" data-key="about">Обо мне</a>
            <a href="https://ramondrole.github.io/Pogreb_Ramondrole-Games/" data-key="games">Наши игры</a>
            <a href="https://ramondrole.github.io/Pogreb_Ramondrole-Userful_functions/" data-key="functions">Полезные функции</a>
        </div>
        <div class="language-switcher">
            <button class="lang-btn" id="langBtn">🌐 RU</button>
            <ul class="lang-dropdown">
                <li><a href="#" data-lang="ru">🇷🇺 Русский</a></li>
                <li><a href="#" data-lang="en">🇺🇸 English</a></li>
                <li><a href="#" data-lang="de">🇩🇪 Deutsch</a></li>
            </ul>
        </div>
    </nav>

    <div class="checkers-wrapper">
        <div class="mode-panel">
            <button class="mode-btn active" data-mode="friend" id="friendModeBtn" data-key="friendMode">Против друга</button>
            <button class="mode-btn" data-mode="bot" id="botModeBtn" data-key="botMode">Против бота</button>
        </div>
        
        <div class="board-wrapper">
            <canvas id="boardCanvas" width="600" height="600"></canvas>
        </div>
        
        <div class="info-panel">
            <span class="turn-indicator" id="turnIndicator" data-key="whiteTurn">Ход: Белые</span>
            <button class="new-game-btn" id="newGameBtn" data-key="newGameBtn">Новая игра</button>
        </div>
    </div>

    <script src="checkers.js"></script>
</body>
</html>
