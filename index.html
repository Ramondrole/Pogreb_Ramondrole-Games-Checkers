<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шашки</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="header">
            <a href="https://ramondrole.github.io/Pogreb_Ramondrole-Games/" class="back-btn">← Назад</a>
            <div class="mode-panel">
                <button class="mode-btn active" data-mode="friend">Против друга</button>
                <button class="mode-btn" data-mode="bot">Против бота</button>
            </div>
        </div>
        <div class="board-wrapper">
            <canvas id="boardCanvas" width="600" height="600"></canvas>
        </div>
        <div class="info-panel">
            <span class="turn-indicator" id="turnIndicator">Ход: Белые</span>
            <button class="new-game-btn" id="newGameBtn">Новая игра</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
